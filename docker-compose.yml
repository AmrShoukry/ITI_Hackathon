version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: item-rental-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: item_rental
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: item-rental-backend
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: "postgresql://postgres:postgres_password@db:5432/item_rental?schema=public"
      JWT_SECRET: "my_premium_secret_key_123456789_xyz"
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: item-rental-frontend
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api"
    depends_on:
      - backend

volumes:
  pgdata:
